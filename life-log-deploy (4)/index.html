<link rel="manifest" href="./manifest.webmanifest?v=3">
<meta name="apple-mobile-web-app-title" content="生活记录">
<meta name="application-name" content="生活记录">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#14161c">
<meta name="format-detection" content="telephone=no">
<style>
  :root{
    --bg:#14161c; --card:#1d2029; --card2:#262a35; --line:#313642;
    --text:#eef1f6; --sub:#8b93a5; --accent:#8ba4ff; --accent2:#5f79f0;
    --milk:#ffb86b; --bath:#5ec8f2; --hair:#c792ea; --food:#ff7a7a;
    --sport:#5fd68a; --shop:#ffd166;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--text);min-height:100vh;
    padding-bottom:calc(140px + env(safe-area-inset-bottom));
    max-width:520px;margin:0 auto;
  }
  /* ---------- 顶部 ---------- */
  header{padding:18px 18px 4px;display:flex;align-items:center;gap:10px;}
  header .logo{width:44px;height:44px;flex-shrink:0;filter:drop-shadow(0 3px 6px rgba(0,0,0,.35));}
  header .logo svg{width:100%;height:100%;display:block;border-radius:11px;}
  header h1{font-size:1.4rem;font-weight:800;letter-spacing:.5px;}
  header .date{color:var(--sub);font-size:.8rem;margin-top:3px;}
  /* ---------- 首页卡片 ---------- */
  .quick-hint{padding:2px 18px 0;color:var(--sub);font-size:.75rem;}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px 16px;}
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:18px;
    padding:16px 14px;cursor:pointer;transition:transform .08s ease,border-color .15s;
    position:relative;overflow:hidden;user-select:none;
  }
  .card:active{transform:scale(.96);}
  .card .icon{font-size:1.7rem;line-height:1;}
  .card .name{font-size:1rem;font-weight:600;margin-top:10px;}
  .card .tag{font-size:.66rem;margin-top:5px;display:inline-block;padding:2px 8px;border-radius:99px;
    background:rgba(255,255,255,.07);color:var(--sub);}
  .card .last{font-size:.78rem;color:var(--sub);margin-top:6px;line-height:1.45;min-height:2.1em;}
  .card .today-dot{
    position:absolute;top:12px;right:12px;font-size:.68rem;
    padding:3px 8px;border-radius:99px;font-weight:600;background:rgba(255,255,255,.06);
  }
  .tool-row{display:flex;gap:10px;padding:2px 16px 0;}
  .tool-btn{
    flex:1;padding:10px;border-radius:12px;background:var(--card);border:1px solid var(--line);
    color:var(--sub);font-size:.78rem;cursor:pointer;font-family:inherit;
  }
  /* ---------- 通用记录条目 ---------- */
  .h-item{
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:12px 14px;margin-top:8px;display:flex;align-items:center;gap:12px;
    border-left:4px solid var(--catc,#555);
  }
  .h-item .h-icon{font-size:1.25rem;width:36px;height:36px;border-radius:10px;
    background:var(--card2);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .h-item .h-main{flex:1;min-width:0;}
  .h-item .h-title{font-size:.92rem;font-weight:600;}
  .h-item .h-detail{font-size:.78rem;color:var(--sub);margin-top:3px;line-height:1.5;}
  .h-item .h-time{font-size:.78rem;color:var(--sub);flex-shrink:0;}
  .h-item .h-del{flex-shrink:0;color:#5a6274;font-size:1rem;padding:6px;border:none;background:none;cursor:pointer;}
  .h-item .h-del:active{color:#ff7a7a;}
  .empty{color:var(--sub);text-align:center;padding:40px 0;font-size:.85rem;}
  /* ---------- 日历 ---------- */
  .cal-head{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 4px;}
  .cal-head .cal-title{font-size:1.05rem;font-weight:700;}
  .cal-nav{
    background:var(--card);border:1px solid var(--line);color:var(--text);
    width:36px;height:36px;border-radius:12px;font-size:1rem;cursor:pointer;font-family:inherit;
  }
  .cal-today-btn{
    background:var(--card);border:1px solid var(--line);color:var(--sub);
    padding:8px 12px;border-radius:12px;font-size:.78rem;cursor:pointer;font-family:inherit;
  }
  .cal-week{display:grid;grid-template-columns:repeat(7,1fr);padding:10px 14px 0;gap:4px;}
  .cal-week span{text-align:center;font-size:.72rem;color:var(--sub);padding:4px 0;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:6px 14px 0;}
  .cal-cell{
    aspect-ratio:.82;border-radius:11px;padding:4px 2px;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
    border:1px solid transparent;transition:transform .08s;user-select:none;
  }
  .cal-cell:active{transform:scale(.93);}
  .cal-cell.dim{opacity:.3;}
  .cal-cell.has{background:var(--card);border-color:var(--line);}
  .cal-cell.today{border-color:var(--accent2);}
  .cal-cell.sel{background:var(--accent2);border-color:var(--accent2);}
  .cal-cell.sel .cal-day{color:#fff;}
  .cal-day{font-size:.82rem;font-weight:600;line-height:1;}
  .cal-cell.today .cal-day{color:var(--accent);}
  .cal-cell.sel.today .cal-day{color:#fff;}
  .cal-dots{display:flex;gap:3px;flex-wrap:wrap;justify-content:center;max-width:100%;min-height:8px;}
  .cal-dots i{width:7px;height:7px;border-radius:50%;display:block;}
  .cal-legend{display:flex;flex-wrap:wrap;gap:10px;padding:12px 18px 0;}
  .cal-legend span{font-size:.7rem;color:var(--sub);display:flex;align-items:center;gap:4px;}
  .cal-legend i{width:8px;height:8px;border-radius:50%;display:inline-block;}
  .cal-detail{padding:12px 16px 20px;}
  .cal-detail-title{font-size:.85rem;font-weight:700;color:var(--sub);padding-bottom:2px;}
  .quick-add{display:flex;gap:8px;margin:10px 0 6px;}
  .quick-add button{
    flex:1;font-size:1.25rem;padding:10px 0;background:var(--card);
    border:1px solid var(--line);border-radius:12px;cursor:pointer;transition:transform .08s;font-family:inherit;
  }
  .quick-add button:active{transform:scale(.9);background:var(--card2);}
  .quick-add-label{font-size:.72rem;color:var(--sub);margin-top:12px;}
  /* ---------- 底部导航 ---------- */
  nav{
    position:fixed;bottom:0;left:0;right:0;max-width:520px;margin:0 auto;
    background:rgba(20,22,28,.92);backdrop-filter:blur(14px);
    border-top:1px solid var(--line);display:flex;
    padding-bottom:env(safe-area-inset-bottom);z-index:50;
  }
  nav button{
    flex:1;background:none;border:none;color:var(--sub);font-size:.72rem;
    padding:9px 0 10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;
    position:relative;font-family:inherit;
  }
  nav button .n-ico{font-size:1.25rem;}
  nav button.on{color:var(--accent);font-weight:600;}
  nav .n-badge{
    position:absolute;top:4px;right:calc(50% - 22px);width:8px;height:8px;border-radius:50%;
    background:#ff6b6b;display:none;
  }
  /* ---------- 底部弹层表单 ---------- */
  #sheetMask{
    position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:100;
    opacity:0;pointer-events:none;transition:opacity .2s;
  }
  #sheetMask.show{opacity:1;pointer-events:auto;}
  #sheet{
    position:absolute;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;
    background:#20242e;border-radius:22px 22px 0 0;padding:18px 18px calc(20px + env(safe-area-inset-bottom));
    transform:translateY(100%);transition:transform .28s cubic-bezier(.32,.72,.35,1);
    max-height:86vh;overflow-y:auto;
  }
  #sheetMask.show #sheet{transform:translateY(0);}
  .sheet-title{font-size:1.05rem;font-weight:700;display:flex;align-items:center;gap:8px;}
  .sheet-sub{font-size:.75rem;color:var(--sub);margin-top:4px;}
  .f-row{margin-top:14px;}
  .f-row label{display:block;font-size:.78rem;color:var(--sub);margin-bottom:6px;}
  .f-row input,.f-row select,.f-row textarea{
    width:100%;background:#171a21;border:1px solid var(--line);border-radius:12px;
    padding:11px 12px;color:var(--text);font-size:.92rem;font-family:inherit;outline:none;
  }
  .f-row input:focus,.f-row select:focus,.f-row textarea:focus{border-color:var(--accent2);}
  .f-hint{font-size:.72rem;color:var(--accent);margin-top:6px;min-height:1em;}
  /* 常规选项 chips */
  .chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px;}
  .chip{
    padding:7px 12px;border-radius:99px;font-size:.78rem;
    background:#171a21;border:1px solid var(--line);color:var(--sub);
    cursor:pointer;font-family:inherit;transition:all .15s;line-height:1.4;
  }
  .chip:active{transform:scale(.94);}
  .chip.on{background:var(--accent2);border-color:var(--accent2);color:#fff;font-weight:600;}
  .seg{display:flex;gap:8px;}
  .seg button{
    flex:1;padding:11px;border-radius:12px;background:#171a21;border:1px solid var(--line);
    color:var(--sub);font-size:.9rem;cursor:pointer;font-family:inherit;
  }
  .seg button.on{background:var(--accent2);border-color:var(--accent2);color:#fff;font-weight:600;}
  .sheet-btns{display:flex;gap:10px;margin-top:20px;}
  .sheet-btns .cancel{
    flex:1;padding:13px;border-radius:14px;background:#171a21;border:1px solid var(--line);
    color:var(--sub);font-size:.95rem;cursor:pointer;font-family:inherit;
  }
  .sheet-btns .ok{
    flex:2;padding:13px;border-radius:14px;background:var(--accent2);border:none;
    color:#fff;font-size:.95rem;font-weight:700;cursor:pointer;font-family:inherit;
  }
  /* ---------- 冰箱 ---------- */
  .fridge-scene{padding:8px 16px 20px;display:flex;flex-direction:column;align-items:center;}
  .fridge-status{font-size:.78rem;color:var(--sub);margin:2px 0 12px;text-align:center;}
  .fridge-status b{color:#ffd166;}
  .fridge{
    width:min(310px,84vw);height:540px;position:relative;perspective:1400px;cursor:pointer;
  }
  .fridge-inner{
    position:absolute;inset:0;border-radius:26px;overflow:hidden;
    background:linear-gradient(180deg,#dceef8 0%,#cfe6f3 36%,#eef6fb 36.5%,#e6f1f8 100%);
    border:7px solid #fbfdff;
    box-shadow:inset 0 0 34px rgba(60,110,150,.18), 0 18px 40px rgba(0,0,0,.45);
    display:flex;flex-direction:column;
  }
  .zone{display:flex;flex-direction:column;min-height:0;}
  .zone.freezer{height:36%;}
  .zone.cold{flex:1;}
  .zone-label{
    font-size:.72rem;font-weight:700;color:#4d7fa3;letter-spacing:2px;
    padding:8px 12px 4px;display:flex;justify-content:space-between;align-items:center;flex-shrink:0;
  }
  .zone-label .cnt{font-weight:400;color:#7fa4be;letter-spacing:0;}
  .shelf{
    flex:1;overflow-y:auto;display:flex;flex-wrap:wrap;gap:10px;align-content:flex-start;
    padding:6px 12px 12px;scrollbar-width:thin;
  }
  .zone.freezer .shelf{border-bottom:3px solid rgba(120,165,195,.35);}
  .zone-empty{width:100%;text-align:center;color:#8fb0c6;font-size:.72rem;padding:14px 0;}
  /* 贴纸 */
  .sticker{
    width:82px;background:#fffdf5;border-radius:10px;padding:12px 4px 7px;
    text-align:center;position:relative;box-shadow:0 3px 7px rgba(40,70,100,.22);
    transform:rotate(var(--rot,0deg));cursor:pointer;transition:transform .15s;
  }
  .sticker:active{transform:rotate(var(--rot,0deg)) scale(.92);}
  .sticker::before{
    content:'';position:absolute;top:-7px;left:50%;transform:translateX(-50%) rotate(-3deg);
    width:36px;height:13px;background:var(--tape,rgba(255,222,130,.9));
    border-radius:2px;box-shadow:0 1px 2px rgba(0,0,0,.12);
  }
  .sticker svg{width:42px;height:42px;display:block;margin:0 auto;}
  .sticker .s-name{
    font-size:.68rem;color:#574f45;font-weight:700;margin-top:4px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 2px;
  }
  .sticker .s-exp{font-size:.58rem;color:#9a9083;margin-top:2px;}
  .sticker .s-days{font-size:.6rem;margin-top:3px;display:inline-block;padding:1px 7px;border-radius:99px;font-weight:700;}
  .s-days.ok{background:#e3f4e4;color:#2f7d44;}
  .s-days.warn{background:#fff2cf;color:#a97b0a;}
  .s-days.bad{background:#ffdfe0;color:#c33;}
  .s-days.frozen{background:#dceeff;color:#2f6ba3;}
  /* 冰箱门 */
  .door{
    position:absolute;left:0;width:100%;z-index:6;cursor:pointer;
    background:linear-gradient(135deg,#ffe9f1 0%,#ffd9e7 60%,#ffcfe0 100%);
    border:7px solid #fff;
    transition:transform .85s cubic-bezier(.55,.06,.25,1);
    transform-origin:left center;backface-visibility:hidden;
    box-shadow:0 14px 34px rgba(0,0,0,.4);
  }
  .door.top{top:0;height:36%;border-radius:26px 26px 12px 12px;}
  .door.bottom{top:36%;height:64%;border-radius:12px 12px 26px 26px;}
  .fridge.open .door{transform:rotateY(-112deg);pointer-events:none;box-shadow:none;}
  .door .handle{
    position:absolute;right:14px;width:9px;border-radius:99px;
    background:linear-gradient(180deg,#fff,#f0dbe4);box-shadow:1px 2px 4px rgba(0,0,0,.15);
  }
  .door.top .handle{top:26%;height:48%;}
  .door.bottom .handle{top:10%;height:26%;}
  .magnet{
    position:absolute;width:26px;height:26px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;font-size:.85rem;
    box-shadow:0 2px 4px rgba(0,0,0,.18);
  }
  .door-face{position:absolute;left:26px;bottom:26%;}
  .door-face .eyes{display:flex;gap:26px;}
  .door-face .eyes i{width:9px;height:12px;border-radius:50%;background:#5a4a52;display:block;}
  .door-face .blush{display:flex;gap:38px;margin-top:-4px;margin-left:-9px;}
  .door-face .blush i{width:13px;height:7px;border-radius:50%;background:rgba(255,140,160,.55);display:block;}
  .door-face .mouth{
    width:14px;height:8px;border:2.5px solid #5a4a52;border-top:none;
    border-radius:0 0 12px 12px;margin:2px 0 0 13px;
  }
  .door-note{
    position:absolute;left:20px;top:16px;background:#fffbe8;color:#8a7a4a;
    font-size:.62rem;font-weight:700;padding:5px 8px;border-radius:4px;transform:rotate(-4deg);
    box-shadow:0 2px 4px rgba(0,0,0,.15);
  }
  .door-hint{
    position:absolute;bottom:14px;left:0;right:0;text-align:center;
    font-size:.68rem;color:#a06c80;font-weight:600;
  }
  .cat-sticker{
    position:absolute;right:16px;bottom:22px;width:54px;height:54px;
    background:#fffdf5;border-radius:9px;padding:3px;
    transform:rotate(6deg);box-shadow:0 3px 7px rgba(0,0,0,.16);
  }
  .cat-sticker svg{width:100%;height:100%;display:block;}
  .fridge-feet{display:flex;justify-content:space-between;width:min(240px,64vw);margin-top:-2px;}
  .fridge-feet i{width:20px;height:12px;background:#3a3f4b;border-radius:0 0 6px 6px;display:block;}
  .fridge-btns{display:flex;gap:10px;margin-top:18px;width:min(310px,84vw);}
  .fridge-btns button{
    flex:1;padding:12px;border-radius:14px;font-size:.88rem;font-weight:700;
    cursor:pointer;font-family:inherit;border:1px solid var(--line);
  }
  .fridge-btns .add{background:var(--accent2);color:#fff;border:none;}
  .fridge-btns .toggle{background:var(--card);color:var(--sub);}
  /* ---------- Toast ---------- */
  #toast{
    position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-80px);
    background:#2a3a2e;border:1px solid #3d5a44;color:#8fe0a8;padding:10px 20px;
    border-radius:99px;font-size:.85rem;font-weight:600;z-index:300;
    transition:transform .3s cubic-bezier(.32,.72,.35,1);pointer-events:none;white-space:nowrap;
    max-width:92vw;overflow:hidden;text-overflow:ellipsis;
  }
  #toast.show{transform:translateX(-50%) translateY(0);}
  /* ---------- 添加到主屏幕引导 ---------- */
  #a2hs{
    position:fixed;left:12px;right:12px;bottom:calc(78px + env(safe-area-inset-bottom));
    max-width:496px;margin:0 auto;z-index:45;
    background:linear-gradient(135deg,#2a2440,#1d2436);border:1px solid #3d4460;
    border-radius:16px;padding:11px 13px;display:none;align-items:center;gap:10px;
    box-shadow:0 8px 26px rgba(0,0,0,.5);
    animation:a2hsIn .35s cubic-bezier(.32,.72,.35,1);
  }
  @keyframes a2hsIn{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
  #a2hs.show{display:flex;}
  #a2hs .a-ico{font-size:1.5rem;flex-shrink:0;}
  #a2hs .a-txt{flex:1;min-width:0;font-size:.78rem;color:var(--sub);line-height:1.5;}
  #a2hs .a-txt b{color:var(--text);display:block;font-size:.85rem;}
  #a2hs button{
    flex-shrink:0;background:var(--accent2);border:none;color:#fff;font-size:.78rem;
    font-weight:700;padding:9px 13px;border-radius:11px;cursor:pointer;font-family:inherit;
  }
  #a2hs .a-x{background:none;color:var(--sub);font-size:1.1rem;padding:4px 6px;}
</style>
</head>

/* ================= 数据层 ================= */
const LS_KEY = 'lifeLog.v2';
const CATS = {
  bath:  {name:'洗澡',    icon:'🛁', color:'#5ec8f2', quick:true},
  hair:  {name:'洗头',    icon:'🧴', color:'#c792ea', quick:true},
  milk:  {name:'喝奶茶',  icon:'🧋', color:'#ffb86b', fields:[
    {k:'brand', label:'品牌', ph:'如：喜茶 / 蜜雪冰城', presets:['喜茶','奈雪的茶','蜜雪冰城','古茗','茶百道','沪上阿姨','霸王茶姬','CoCo 都可','书亦烧仙草','甜啦啦','咖啡店']},

  food:  {name:'外出吃饭',icon:'🍜', color:'#ff7a7a', fields:[

    {k:'place', label:'饭店名', ph:'如：海底捞', presets:['海底捞','小肥羊','呷哺呷哺','肯德基','麦当劳','星巴克','瑞幸','喜家德','和府捞面','沙县小吃','必胜客','汉堡王','奈雪','海底捞(自己家附近)']},
    {k:'dish',  label:'菜品', ph:'如：毛肚、虾滑', presets:['火锅','烤肉','面条','米饭套餐','沙拉','炒饭','寿司','刺身','炸鸡','汉堡','火锅菜','甜点','小菜','汤']},

  ]},
  sport: {name:'运动',    icon:'🏃', color:'#5fd68a', fields:[

/* ================= 工具 ================= */
const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2,'0');
function fmtTime(ts){ const d=new Date(ts); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function fmtDate(ts){ const d=new Date(ts); return `${d.getMonth()+1}月${d.getDate()}日`; }
function fmtDateY(ts){
  const d=new Date(ts), n=new Date();
  return d.getFullYear()!==n.getFullYear() ? `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日` : fmtDate(ts);
}
function fmtYMD(ts){ const d=new Date(ts); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
/* 解析 <input type="date"> 的值（兼容 yyyy-mm-dd 与 mm/dd/yyyy） */
function parseYMD(str, endOfDay){
  if(!str) return null;
  let y, m, d;
  const s = String(str).trim();
  if(/^\d{4}-\d{1,2}-\d{1,2}$/.test(s)){
    [y,m,d] = s.split('-').map(Number);
  }else{
    const p = s.split(/[/-]/).map(Number);
    if(p.length!==3) return null;
    if(p[0] > 12){ [y,m,d] = p; }        // 已经是 y-m-d
    else { [m,d,y] = p; }                // m/d/y
  }
  if(!y||!m||!d) return null;
  return endOfDay ? new Date(y, m-1, d, 23,59,59,999).getTime()
                  : new Date(y, m-1, d, 12,0,0).getTime();
}
function dayStart(ts){ const d=new Date(ts); return new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime(); }
function isSameDay(a,b){ return dayStart(a)===dayStart(b); }
function ago(ts){
  const m = Math.floor((Date.now()-ts)/60000);
  if(m<1) return '刚刚';
  if(m<60) return `${m} 分钟前`;
  const h = Math.floor(m/60);
  if(h<24) return `${h} 小时前`;
  const d = Math.floor(h/24);
  return d===1 ? '昨天' : `${d} 天前`;
}
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(t._timer); t._timer = setTimeout(()=>t.classList.remove('show'), 1800);
}
function esc(s){ return String(s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function detailText(e){
  const d = e.data || {};
  switch(e.cat){
    case 'milk':  return [d.brand, d.type, d.slot].filter(Boolean).join(' · ');
    case 'food':  return [d.kind, d.place, d.dish, d.slot].filter(Boolean).join(' · ');
    case 'sport': return [d.type, d.dur && d.dur+' 分钟', d.slot].filter(Boolean).join(' · ');
    case 'shop':  return [d.store, d.kind, d.items, d.slot].filter(Boolean).join(' · ');
    default: return '';
  }
}
function makeEventItem(e, onDel){

/* 详细记录表单（奶茶/吃饭/运动/超市），带常规选项 chips */
/* 时段 → 对应的具体时刻（选时段即决定这条记录发生在几点） */
const SLOT_TIME = {
  '清晨':'06:30','早餐':'08:00','上午':'10:00','中午':'12:00','午餐':'12:00',
  '午后':'14:00','下午':'16:00','下午茶':'15:30','傍晚':'18:00','晚餐':'18:30',
  '晚餐后':'20:00','晚上':'20:00','夜间':'21:00','深夜':'22:00','睡前':'22:30',
  '夜宵':'22:00','下班后':'19:00','周末':'10:00','周末补货':'10:30',
};
function openDetailForm(cat, ts){
  const c = CATS[cat];
  const isToday = isSameDay(ts, Date.now());
  const d = new Date(ts);
  const rows = c.fields.map(f=>{
    const chips = f.presets && f.presets.length ? `
      <div class="chips" data-chips="${f.k}">
        ${f.presets.map(p=>`<button type="button" class="chip" data-v="${esc(p)}">${esc(p)}</button>`).join('')}
      </div>` : '';
    return `
    <div class="f-row">
      <label>${f.label}</label>
      <input id="f_${f.k}" type="${f.type||'text'}" placeholder="${f.ph}" ${f.type==='number'?'min="1" inputmode="numeric"':''}>
      ${chips}
    </div>`;
  }).join('');

  openSheet(`${c.icon} ${c.name}`, isToday ? '记录现在这一刻' : `补记 ${d.getMonth()+1}月${d.getDate()}日`,
    rows, ()=>{
      const data = {};
      for(const f of c.fields){
        const v = $('#f_'+f.k).value.trim();
        if(v) data[f.k] = v;
      }
      // 记录时刻：今天取当前时间；补记过去按所选时段折算到那一天
      let when;
      if(isToday){
        when = Date.now();
      }else{
        const t = SLOT_TIME[data.slot] || '12:00';
        const p = t.split(':').map(Number);
        when = dayStart(ts) + (p[0]*60+p[1])*60000;
      }
      DB.events.push({id:uid(), cat, ts:when, data});
      save(); closeSheet(); refreshAll();
      toast(`${c.icon} ${c.name} 已记下 ✓`);
    });

  // chips 点击 → 填入输入框（再次点击取消）
  document.querySelectorAll('#sheetBody .chips').forEach(box=>{
    box.addEventListener('click', e=>{
      const b = e.target.closest('.chip'); if(!b) return;
      const key = box.dataset.chips;
      const input = $('#f_'+key);
      if(!input) return;
      const on = b.classList.contains('on');
      if(input.dataset.multi){                       // 多选字段（购买物品/菜品）
        if(on){ b.classList.remove('on'); }
        else { b.classList.add('on'); }
        const picked = [...box.querySelectorAll('.chip.on')].map(x=>x.dataset.v);
        input.value = picked.join('、');
      }else{
        if(on){ b.classList.remove('on'); input.value=''; }
        else{
          box.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));
          b.classList.add('on');
          input.value = b.dataset.v;
        }
      }
      input.dispatchEvent(new Event('input'));
    });
  });
  // 多选字段标记
  for(const f of c.fields){
    if(f.k==='dish' || f.k==='items'){ const i=$('#f_'+f.k); if(i) i.dataset.multi='1'; }
  }
}

let calYear, calMonth, selDay;
(function(){
  const n = new Date();
  calYear = n.getFullYear(); calMonth = n.getMonth();
  selDay = dayStart(Date.now());
})();

function eventsByDay(){
  const map = {};
  for(const e of DB.events){
    const k = dayStart(e.ts);
    (map[k] = map[k] || []).push(e);
  }
  return map;
}

function renderCalendar(){
  $('#calTitle').textContent = `${calYear}年${calMonth+1}月`;
  const grid = $('#calGrid');
  grid.innerHTML = '';
  const map = eventsByDay();
  const todayStart = dayStart(Date.now());
  const first = new Date(calYear, calMonth, 1);
  const offset = (first.getDay()+6)%7;
  const daysInMonth = new Date(calYear, calMonth+1, 0).getDate();
  const prevDays = new Date(calYear, calMonth, 0).getDate();

  const mkCell = (dayNum, y, m, dim)=>{
    const dStart = new Date(y,m,dayNum).getTime();
    const cell = document.createElement('div');
    const evts = map[dStart] || [];
    cell.className = 'cal-cell'
      + (dim?' dim':'') + (evts.length?' has':'')
      + (dStart===todayStart?' today':'') + (dStart===selDay?' sel':'');
    // 每个类别一个颜色点，直观看出这天做了什么
    const cats = [...new Set(evts.map(e=>e.cat))];
    const dots = cats.map(k=>`<i style="background:${CATS[k].color}"></i>`).join('');
    cell.innerHTML = `<span class="cal-day">${dayNum}</span><span class="cal-dots">${dots}</span>`;
    cell.onclick = ()=>{
      selDay = dStart;
      if(dim){ calYear = y; calMonth = m; }
      renderCalendar();
    };
    grid.appendChild(cell);
  };
  for(let i=offset-1;i>=0;i--){
    const pm = calMonth===0?11:calMonth-1, py = calMonth===0?calYear-1:calYear;
    mkCell(prevDays-i, py, pm, true);
  }
  for(let d=1; d<=daysInMonth; d++) mkCell(d, calYear, calMonth, false);
  const trail = (7-(offset+daysInMonth)%7)%7;
  for(let d=1; d<=trail; d++){
    const nm = calMonth===11?0:calMonth+1, ny = calMonth===11?calYear+1:calYear;
    mkCell(d, ny, nm, true);
  }

  // 图例
  $('#calLegend').innerHTML = Object.keys(CATS)
    .map(k=>`<span><i style="background:${CATS[k].color}"></i>${CATS[k].name}</span>`).join('');

  renderCalDetail(map);
}

function renderCalDetail(map){
  map = map || eventsByDay();
  const wrap = $('#calDetail');
  const evts = (map[selDay]||[]).sort((a,b)=>a.ts-b.ts);
  const d = new Date(selDay);
  const isToday = isSameDay(selDay, Date.now());
  const label = isToday ? '今天' : `${d.getMonth()+1}月${d.getDate()}日 周${'日一二三四五六'[d.getDay()]}`;
  wrap.innerHTML = `<div class="cal-detail-title">${label}${evts.length?' · '+evts.length+' 条':''}</div>`;

  const addLabel = document.createElement('div');
  addLabel.className = 'quick-add-label';
  addLabel.textContent = '给这一天加记录（🛁🧴 一键直记，其余填详情）：';
  wrap.appendChild(addLabel);
  const addRow = document.createElement('div');
  addRow.className = 'quick-add';
  for(const key of Object.keys(CATS)){
    const b = document.createElement('button');
    b.textContent = CATS[key].icon;
    b.title = CATS[key].name;
    b.onclick = ()=>{
      if(CATS[key].quick){
        const ts = isToday ? Date.now() : selDay + 12*3600*1000;
        DB.events.push({id:uid(), cat:key, ts, data:{}});
        save(); renderCalendar(); renderHome();
        toast(`${CATS[key].icon} ${CATS[key].name} +1`);
      }else{
        openDetailForm(key, selDay);
        // 表单提交后刷新日历
        const oldOk = $('#sheetOk').onclick;
      }
    };
    addRow.appendChild(b);
  }
  wrap.appendChild(addRow);

  if(!evts.length){
    const empty = document.createElement('div');
    empty.className = 'empty';
    empty.style.padding = '24px 0';
    empty.textContent = '这一天还没有记录 🌱';
    wrap.appendChild(empty);
    return;
  }
  for(const e of evts){
    wrap.appendChild(makeEventItem(e, ()=>{ renderCalendar(); renderHome(); }));
  }
}

/* 分类 → 图案与保质期（名称匹配不到时用分类兜底） */
const KIND_RULE = {
  '乳制品':{key:'milk',     fridgeDays:7,  freezerDays:30},
  '蛋类':  {key:'egg',      fridgeDays:30, freezerDays:90},
  '烘焙':  {key:'bread',    fridgeDays:5,  freezerDays:30},
  '水果':  {key:'fruit',    fridgeDays:7,  freezerDays:30},
  '蔬菜':  {key:'veg',      fridgeDays:4,  freezerDays:30},

  '海鲜':  {key:'fish',     fridgeDays:1,  freezerDays:60},
  '速冻':  {key:'dumpling', fridgeDays:3,  freezerDays:60},
  '主食':  {key:'bowl',     fridgeDays:2,  freezerDays:30},
  '剩菜':  {key:'bowl',     fridgeDays:2,  freezerDays:7},
  '饮料':  {key:'drink',    fridgeDays:30, freezerDays:60},
  '调味':  {key:'box',      fridgeDays:90, freezerDays:180},
  '其他':  {key:'box',      fridgeDays:7,  freezerDays:30},
};

function foodRule(name, kind){
  for(const [re, key, fd, zd] of FOOD_RULES){
    if(re.test(name)) return {key, fridgeDays:fd, freezerDays:zd};
  }
  if(kind && KIND_RULE[kind]) return KIND_RULE[kind];
  return {key:'box', fridgeDays:DEFAULT_SHELF.fridge, freezerDays:DEFAULT_SHELF.freezer};
}

/* ---- 冰箱渲染 ---- */
const TAPES = ['rgba(255,222,130,.92)','rgba(168,230,207,.92)','rgba(255,183,200,.92)','rgba(174,214,255,.92)','rgba(221,196,255,.92)'];
let fridgeOpen = false;

function daysLeft(item){
  return Math.round((dayStart(item.expiry) - dayStart(Date.now())) / 86400000);
}
function dayBadge(item){
  const dl = daysLeft(item);
  if(item.zone==='freezer' && dl > 14)
    return `<span class="s-days frozen">❄ ${fmtDateY(item.expiry)}到期</span>`;
  if(dl < 0)  return `<span class="s-days bad">已过期 ${-dl} 天</span>`;
  if(dl === 0) return `<span class="s-days bad">今天过期！</span>`;
  if(dl <= 2)  return `<span class="s-days warn">剩 ${dl} 天</span>`;
  return `<span class="s-days ok">剩 ${dl} 天</span>`;
}
function renderFridge(){
  const fz = DB.fridge.filter(i=>i.zone==='freezer');
  const cd = DB.fridge.filter(i=>i.zone==='fridge');
  $('#fzCount').textContent = fz.length ? `${fz.length} 件` : '';
  $('#cdCount').textContent = cd.length ? `${cd.length} 件` : '';

  const paint = (list, box)=>{
    box.innerHTML = '';
    if(!list.length){
      box.innerHTML = '<div class="zone-empty">空空如也，去囤点货吧 🛒</div>';
      return;
    }
    list.sort((a,b)=>a.expiry-b.expiry).forEach((it,idx)=>{
      const rule = foodRule(it.name, it.kind);
      const st = document.createElement('div');
      st.className = 'sticker';
      st.style.setProperty('--rot', ((idx%5)-2)*2.2 + 'deg');
      st.style.setProperty('--tape', TAPES[idx % TAPES.length]);
      st.innerHTML = `${doodleSVG(rule.key)}<div class="s-name">${esc(it.name)}</div>
        <div class="s-exp">${it.kind?esc(it.kind)+' · ':''}${fmtDate(it.putIn)} 入</div>${dayBadge(it)}`;
      st.onclick = ()=> openFoodDetail(it);
      box.appendChild(st);
    });
  };
  paint(fz, $('#fzShelf'));
  paint(cd, $('#cdShelf'));

  // 状态提示
  const soon = DB.fridge.filter(i=>daysLeft(i)>=0 && daysLeft(i)<=2).length;
  const over = DB.fridge.filter(i=>daysLeft(i)<0).length;
  const total = DB.fridge.length;
  let msg;
  if(!total) msg = '冰箱是空的，点下方「放入食物」开始囤货';
  else if(over) msg = `共 ${total} 件 · <b>${over} 件已过期</b>，快处理！`;
  else if(soon) msg = `共 ${total} 件 · <b>${soon} 件快过期了</b>，抓紧吃～`;
  else msg = `共 ${total} 件，都很新鲜 ✨`;
  $('#fridgeStatus').innerHTML = msg;
  updateFridgeBadge();
}
function updateFridgeBadge(){
  const bad = (DB.fridge||[]).some(i=>daysLeft(i)<=2);
  const b = $('#fridgeBadge');
  if(b) b.style.display = bad ? 'block' : 'none';
}

/* 食物详情：查看放入/过期时间、修改保质期、吃掉或扔掉 */
function openFoodDetail(item){
  const rule = foodRule(item.name, item.kind);
  const dl = daysLeft(item);
  const state = dl < 0 ? '已经过期啦，别吃了' : dl === 0 ? '今天就是最后期限！' : dl <= 2 ? '快过期啦，赶紧吃掉' : '状态很棒 ✨';
  openSheet('🧾 ' + item.name, item.zone === 'freezer' ? '冷冻区' : '冷藏区',    `<div style="display:flex;gap:14px;align-items:center;margin-top:14px;">
      <div style="width:76px;height:76px;flex-shrink:0;background:#fffdf5;border-radius:12px;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 8px rgba(0,0,0,.18)">${doodleSVG(rule.key)}</div>
      <div style="font-size:.82rem;line-height:1.9;color:var(--sub)">
        放入时间：<b style="color:var(--text)">${fmtYMD(item.putIn)}</b><br>
        过期时间：<b style="color:var(--text)">${fmtYMD(item.expiry)}</b><br>
        剩余：<b style="color:${dl<0?'#ff6b6b':dl<=2?'#ffd166':'#5fd68a'}">${dl<0?`过期 ${-dl} 天`:dl+' 天'}</b>
      </div>
    </div>
    <div style="margin-top:12px;font-size:.8rem;color:${dl<0?'#ff6b6b':'#8fd6a0'}">${state}</div>
    <div class="f-row"><label>修改过期时间</label><input id="fd_exp" type="date" value="${fmtYMD(item.expiry)}"></div>
    <div class="f-row" style="display:flex;gap:10px">
      <button id="fd_eat" style="flex:1;padding:12px;border-radius:12px;background:#2f7d44;border:none;color:#fff;font-weight:700;cursor:pointer">吃掉 / 拿走</button>
      <button id="fd_del" style="flex:1;padding:12px;border-radius:12px;background:#3a2226;border:1px solid #6b3a3f;color:#ff9a9a;font-weight:700;cursor:pointer">扔掉</button>
    </div>`,
    ()=>{
      const v = $('#fd_exp').value;
      if(v) item.expiry = parseYMD(v, true);
      save(); closeSheet(); renderFridge(); toast('已更新 ✓');
    }, '保存修改');
  $('#fd_eat').onclick = ()=>{
    DB.fridge = DB.fridge.filter(x=>x.id!==item.id);
    save(); closeSheet(); renderFridge(); toast('已吃掉，真棒 😋');
  };
  $('#fd_del').onclick = ()=>{
    if(!confirm(`确定扔掉「${item.name}」？`)) return;
    DB.fridge = DB.fridge.filter(x=>x.id!==item.id);
    save(); closeSheet(); renderFridge(); toast('已扔掉 🗑');
  };
}

/* 保质期快捷天数 */
const SHELF_DAYS = {'3天':3,'1周':7,'2周':14,'1个月':30,'3个月':90,'半年':180,'1年':365};

$('#addFoodBtn').onclick = ()=>{
  const today = fmtYMD(Date.now());
  openSheet('🥬 放入食物', '写上名字就会生成手绘小贴纸；不填过期日期会按建议保质期自动算', `
    <div class="f-row"><label>食物名称</label><input id="ff_name" placeholder="如：鲜牛奶 / 草莓 / 鸡胸肉">
      <div class="chips" data-chips="ff_name">

      </div>
    </div>
    <div class="f-row"><label>分类（决定贴纸图案）</label>
      <input type="hidden" id="ff_kind">
      <div class="chips" data-chips="ff_kind">
        ${FRIDGE_PRESETS.kind.map(p=>`<button type="button" class="chip" data-v="${esc(p)}">${esc(p)}</button>`).join('')}
      </div>
    </div>
    <div class="f-row"><label>放在哪层</label>
      <div class="seg">
        <button id="ff_fridge" class="on">🧊 冷藏</button>
        <button id="ff_freezer">❄️ 冷冻</button>
      </div>
    </div>
    <div class="f-row"><label>放入时间</label><input id="ff_putin" type="date" value="${today}"></div>
    <div class="f-row"><label>过期时间（可不填）</label><input id="ff_expiry" type="date">
      <div class="chips" data-chips="ff_shelf">
        ${FRIDGE_PRESETS.shelf.map(p=>`<button type="button" class="chip" data-v="${esc(p)}">${esc(p)}</button>`).join('')}
      </div>
      <div class="f-hint" id="ff_hint">输入名称后这里会给出建议保质期</div>
    </div>
  `, ()=>{
    const name = $('#ff_name').value.trim();
    if(!name){ toast('先写个名字吧'); return; }
    const zone = $('#ff_freezer').classList.contains('on') ? 'freezer' : 'fridge';
    const kind = $('#ff_kind').value.trim();
    const putIn = parseYMD($('#ff_putin').value) || Date.now();
    let expiry, suggested = false, sugDays = 0;
    if($('#ff_expiry').value){
      expiry = parseYMD($('#ff_expiry').value, true);
      if(expiry == null){ toast('过期日期看不懂，换个格式试试'); return; }
    }else{
      const rule = foodRule(name, kind);
      sugDays = zone==='freezer' ? (rule.freezerDays||30) : rule.fridgeDays;
      expiry = dayStart(putIn) + sugDays*86400000;
      suggested = true;
    }
    DB.fridge.push({id:uid(), name, kind, zone, putIn, expiry});
    save(); closeSheet(); renderFridge(); setDoor(true);
    toast(suggested ? `已贴进冰箱 · 建议保质 ${sugDays} 天` : '已贴进冰箱 ✓');
  }, '放进冰箱 🧊');

      const on = b.classList.contains('on');
      if(key === 'ff_shelf'){
        if(on){ b.classList.remove('on'); $('#ff_expiry').value=''; }
        else{
          box.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));
          b.classList.add('on');

          const base = parseYMD($('#ff_putin').value) || Date.now();
          $('#ff_expiry').value = fmtYMD(dayStart(base) + days*86400000);
        }
        return;
      }
      const input = $('#'+key);
      if(!input) return;
      if(on){ b.classList.remove('on'); input.value=''; }
      else{
        box.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));
        b.classList.add('on');
        input.value = b.dataset.v;
        // 选了食物名 → 自动带上分类并高亮
        if(key === 'ff_name'){
          const kind = NAME_KIND[b.dataset.v];
          if(kind){

            const kb = document.querySelector('#sheetBody .chips[data-chips="ff_kind"]');
            if(kb){
              kb.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));
              const hit = [...kb.querySelectorAll('.chip')].find(x=>x.dataset.v===kind);

  $('#ff_name').addEventListener('input', updHint);
  $('#ff_putin').addEventListener('change', updHint);
  function updHint(){
    const name = $('#ff_name').value.trim();
    const kind = $('#ff_kind').value.trim();
    if(!name){ $('#ff_hint').textContent = '输入名称后这里会给出建议保质期'; return; }
    const rule = foodRule(name, kind);
    const zone = $('#ff_freezer').classList.contains('on') ? 'freezer' : 'fridge';
    const d = zone==='freezer' ? (rule.freezerDays||30) : rule.fridgeDays;
    $('#ff_hint').textContent = `💡 建议：${zone==='freezer'?'冷冻':'冷藏'}约 ${d} 天${rule.key==='box'?'（没查到这个食物，按通用建议算）':''}`;
  }
};

/* ================= 桌面图标修复 ================= */
/* 桌面图标不更新，通常是浏览器缓存了旧的 manifest / 图标。
   这里做两件事：清掉 SW + Cache Storage，并给图标链接打上新版本号强制刷新。 */
$('#fixIconBtn').onclick = async ()=>{
  // 1) 给所有图标链接加新时间戳，强制浏览器重新拉取
  const stamp = Date.now();
  document.querySelectorAll('link[rel="icon"], link[rel="apple-touch-icon"]').forEach(l=>{
    if(l.href.startsWith('data:')) return;
    l.href = l.href.split('?')[0] + '?v=' + stamp;
  });
  const mf = document.querySelector('link[rel="manifest"]');
  if(mf) mf.href = './manifest.webmanifest?v=' + stamp;
  // 2) 清缓存
  try{
    if('caches' in window){
      const keys = await caches.keys();
      await Promise.all(keys.map(k => caches.delete(k)));
    }
    if(navigator.serviceWorker){
      const regs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r => r.unregister()));
    }
  }catch(e){}
  toast('已刷新图标缓存，请删除旧图标后重新添加 🐾');
};

$('#resetAppBtn').onclick = async ()=>{
  if(!confirm('将清空浏览器缓存与 Service Worker（不会删除你的记录），确定吗？')) return;
  try{
    if('caches' in window){
      const keys = await caches.keys();
      await Promise.all(keys.map(k => caches.delete(k)));
    }
    if(navigator.serviceWorker){
      const regs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r => r.unregister()));
    }
    localStorage.removeItem('lifeLog.a2hsClosed');
  }catch(e){}
  toast('已清空缓存，重新打开页面即可');
};

/* ================= 导入 / 导出 ================= */
$('#exportBtn').onclick = ()=>{
  const blob = new Blob([JSON.stringify(DB,null,2)],{type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `life-log-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
};
$('#importBtn').onclick = ()=> $('#importFile').click();
$('#importFile').onchange = e=>{
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = ()=>{
    try{
      const data = JSON.parse(r.result);
      if(!Array.isArray(data.events)) throw 0;
      DB = {events:data.events, fridge:Array.isArray(data.fridge)?data.fridge:[]};
      save(); refreshAll(); toast('导入成功 ✓');
    }catch(_){ toast('文件格式不对'); }
  };
  r.readAsText(f);
};

/* ================= 添加到主屏幕（A2HS） ================= */
/* 独立运行检测：已安装则不再提示 */
function isStandalone(){
  return (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches)
      || window.navigator.standalone === true;
}
function isIOS(){
  return /iPad|iPhone|iPod/.test(navigator.userAgent)
      || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
}
function showA2HS(){
  if(isStandalone()) return;
  if(localStorage.getItem('lifeLog.a2hsClosed')) return;
  const tip = isIOS()
    ? '点击 Safari 底部「分享」→「添加到主屏幕」'
    : '点击浏览器菜单 →「安装应用 / 添加到主屏幕」';
  $('#a2hsTip').textContent = tip;
  $('#a2hsGo').textContent = isIOS() ? '怎么加？' : '添加';
  $('#a2hs').classList.add('show');
}
$('#a2hsX').onclick = ()=>{
  $('#a2hs').classList.remove('show');
  localStorage.setItem('lifeLog.a2hsClosed','1');
};
$('#a2hsGo').onclick = ()=>{
  const b = $('#a2hsGo');
  if(b.dataset.done){                       // 已点过一次 → 显示详细步骤
    const tip = isIOS()
      ? 'Safari 底部「分享」按钮 ⬆️ → 下滑找到「添加到主屏幕」→ 右上角「添加」'
      : '浏览器右上角「⋮」菜单 → 选择「安装应用」或「添加到主屏幕」';
    $('#a2hsTip').textContent = tip;
    return;
  }
  b.dataset.done = '1';
  if(isIOS()){
    $('#a2hsTip').textContent = 'Safari 底部「分享」按钮 ⬆️ → 下滑找到「添加到主屏幕」→ 右上角「添加」';
    $('#a2hsGo').textContent = '知道了';
  }else{
    // Android / 桌面：优先用原生安装提示
    if(window.deferredPrompt){
      window.deferredPrompt.prompt();
      window.deferredPrompt.userChoice.finally(()=>{
        window.deferredPrompt = null;
        $('#a2hs').classList.remove('show');
        localStorage.setItem('lifeLog.a2hsClosed','1');
      });
      return;
    }
    $('#a2hsTip').textContent = '浏览器右上角「⋮」菜单 → 选择「安装应用」或「添加到主屏幕」';
    $('#a2hsGo').textContent = '知道了';
  }
};
window.addEventListener('beforeinstallprompt', e=>{
  e.preventDefault();
  window.deferredPrompt = e;
});
window.addEventListener('appinstalled', ()=>{
  window.deferredPrompt = null;
  $('#a2hs').classList.remove('show');
  localStorage.setItem('lifeLog.a2hsClosed','1');
  toast('已添加到主屏幕 🐾');
});
setTimeout(showA2HS, 1500);

/* ================= Service Worker（图标/manifest 永不缓存旧版） ================= */
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('./sw.js').then(reg=>{
      // 有新版本就立即激活，避免旧 SW 卡住新图标
      reg.addEventListener('updatefound', ()=>{
        const nw = reg.installing;
        if(nw) nw.addEventListener('statechange', ()=>{ if(nw.state==='activated') location.reload(); });
      });
    }).catch(()=>{});
  });
}

/* ================= 启动 ================= */
renderHome();
renderFridge();
setInterval(refreshAll, 60000);
